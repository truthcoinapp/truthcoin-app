name: pages

# The phone page, built from the tagged source and served by GitHub Pages at https://truthcoinapp.github.io/truthcoin-app/.
# Settings, once: Pages > Source "GitHub Actions"; Environments > github-pages > Deployment branches and tags: add the
# tag rule v* (by default only the default branch may deploy, and a tag's deploy is refused).
# workflow_dispatch redeploys a tag (or, if that environment allows it, a branch).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cut short.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No npm cache: the page holds the phone's keys, so it is built from the lockfile alone.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: phone/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
